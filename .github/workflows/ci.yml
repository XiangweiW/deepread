name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Type-check (all workspaces)
        run: npm --workspaces --if-present run typecheck

      - name: Build Zotero plugin
        run: npm run build

      - name: Build MCP server bridge
        run: npm --workspace=deepread-mcp run build

      - name: Package XPI
        run: npm run package

      - name: Pack MCP server tarball
        run: npm pack --workspace=deepread-mcp --pack-destination=dist

      - name: Upload XPI as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepread-xpi
          path: dist/*.xpi
          if-no-files-found: error

      - name: Upload MCP server tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepread-mcp-tarball
          path: dist/deepread-mcp-*.tgz
          if-no-files-found: error

      - name: Attach XPI to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.xpi
            dist/deepread-mcp-*.tgz
          generate_release_notes: true

      - name: Check for NPM_TOKEN
        id: npm_token
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish deepread-mcp to npm (on tag push, if NPM_TOKEN configured)
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm_token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace=deepread-mcp --access public
